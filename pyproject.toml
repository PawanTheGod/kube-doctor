[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kube-snapshot-doctor"
version = "0.1.0"
description = "Diagnose Kubernetes problems from a screenshot plus optional logs using an open-weight vision model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kube Snapshot Doctor contributors" }]
keywords = ["kubernetes", "sre", "screenshot", "vision", "llm", "diagnostics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "google-genai>=1.0.0",
  "openai>=1.40.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pillow>=10.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = ["gradio>=4.36"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
kube-doctor = "kube_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/AdiB1619/kube-snapshot-doctor"
Issues = "https://github.com/AdiB1619/kube-snapshot-doctor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kube_doctor"]

[tool.hatch.build.targets.wheel.force-include]
"skills/kube-snapshot-doctor/references" = "kube_doctor/references"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "live: tests that call a real model API; deselected unless KUBE_DOCTOR_LIVE=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ANN", "PTH"]
# UP042 prefers StrEnum, but pydantic v2 round-trips ``str, Enum`` more
# predictably across versions, and these enums are serialised in every output.
ignore = ["ANN401", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101", "E501"]
# Fixture terminal output must stay byte-exact, so it is not wrapped.
"evals/make_fixtures.py" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
